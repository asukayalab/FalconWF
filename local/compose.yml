name: falcon-wf-local
services:
  backup-storage-init:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 33:33 /fwf-backups && chmod 0700 /fwf-backups"]
    volumes:
      - backups:/fwf-backups
    restart: "no"
  db:
    image: mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: falcon
      MARIADB_USER: falcon
      MARIADB_PASSWORD: ${FWF_DB_PASSWORD:?Generate local/.env first}
      MARIADB_ROOT_PASSWORD: ${FWF_DB_ROOT_PASSWORD:?Generate local/.env first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache@sha256:e04cf657f24889e96b5544828cdd5a92a0b51819f3e1899183f9be6ea0485edf
    ports:
      - "127.0.0.1:8091:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: falcon
      WORDPRESS_DB_PASSWORD: ${FWF_DB_PASSWORD}
      WORDPRESS_DB_NAME: falcon
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        define('FS_METHOD', 'direct');
        define('FWF_BACKUP_DIR', '/fwf-backups');
    depends_on:
      db:
        condition: service_healthy
      backup-storage-init:
        condition: service_completed_successfully
    volumes:
      - wordpress:/var/www/html
      - backups:/fwf-backups
      - ../dist:/artifacts:ro
      - ../tests:/fwf-tests:ro
      - ../examples:/fwf-examples:ro
  cli: &fwf-cli
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: falcon
      WORDPRESS_DB_PASSWORD: ${FWF_DB_PASSWORD}
      WORDPRESS_DB_NAME: falcon
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('FS_METHOD', 'direct');
        define('FWF_BACKUP_DIR', '/fwf-backups');
    volumes:
      - wordpress:/var/www/html
      - backups:/fwf-backups
      - ../dist:/artifacts:ro
      - ../tests:/fwf-tests:ro
      - ../examples:/fwf-examples:ro
    depends_on:
      db:
        condition: service_healthy
      backup-storage-init:
        condition: service_completed_successfully
  backup-worker:
    <<: *fwf-cli
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do if wp cron event list --field=hook | grep -qx fwf_backup_step; then wp cron event run fwf_backup_step --quiet; fi; if wp cron event list --field=hook | grep -qx fwf_backup_scheduled; then wp cron event run fwf_backup_scheduled --due-now --quiet; fi; sleep 5; done"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
volumes:
  database:
  wordpress:
  backups:
